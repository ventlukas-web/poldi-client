name: Poldi Screenshots
on:
  push:
    branches: [screenshots-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Neueste Versionen fuer 26.2 holen
        run: |
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          FAPI=$(curl -s -G 'https://api.modrinth.com/v2/project/fabric-api/version' \
            --data-urlencode 'game_versions=["26.2"]' --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].version_number')
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties; fi
          if [ -n "$FAPI" ] && [ "$FAPI" != "null" ]; then sed -i "s/^fabric_api_version=.*/fabric_api_version=$FAPI/" gradle.properties; fi
      - name: Xvfb + Mesa
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils
      - name: API-Signaturen (javap) fuer Entwicklung
        shell: bash
        run: |
          gradle compileJava --no-daemon -q || true
          J=$(grep -l "net/minecraft/client/gui/components/AbstractButton.class" $(find ~/.gradle .gradle build -name "*.jar" 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$J"
          mkdir -p api
          for c in net.minecraft.client.gui.components.AbstractButton net.minecraft.client.gui.components.Button net.minecraft.client.gui.components.AbstractWidget net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.components.WidgetSprites net.minecraft.client.gui.ActiveTextCollector net.minecraft.client.gui.components.Checkbox net.minecraft.client.gui.components.AbstractSliderButton net.minecraft.client.gui.components.CycleButton net.minecraft.client.gui.screens.options.OptionsSubScreen; do
            javap -p -cp "$J" "$c" > "api/$c.txt" 2>&1 || true
          done
          javap -p -cp "$J" -c net.minecraft.client.gui.components.Button\$Plain > api/ButtonPlain.txt 2>&1 || true
          ls api
      - name: Minecraft starten und Screenshots machen
        shell: bash
        run: set -o pipefail; gradle runClientGameTest --no-daemon --stacktrace 2>&1 | tee shots.log
      - name: Screenshots in Branch screenshots ablegen
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/s; find . -path ./.git -prune -o -name "*.png" -path "*screenshots*" -print -exec cp {} /tmp/s/ \; || true
          cp shots.log /tmp/s/ 2>/dev/null || true; cp -r api /tmp/s/ 2>/dev/null || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan screenshots; git rm -rfq . >/dev/null 2>&1 || true
          cp -r /tmp/s/* . 2>/dev/null || true
          git add -A; git commit -qm "Screenshots ${{ github.run_number }}" || true
          git push -f origin screenshots
