name: Build Poldi Client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Neueste Versionen fuer 26.2 holen
        run: |
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          FAPI=$(curl -s -G 'https://api.modrinth.com/v2/project/fabric-api/version' \
            --data-urlencode 'game_versions=["26.2"]' --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].version_number')
          echo "loader=$LOADER fabric-api=$FAPI"
          if [ -n "$LOADER" ] && [ "$LOADER" != "null" ]; then sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties; fi
          if [ -n "$FAPI" ] && [ "$FAPI" != "null" ]; then sed -i "s/^fabric_api_version=.*/fabric_api_version=$FAPI/" gradle.properties; fi
      - name: Build (Version 1.0.<Build-Nummer>)
        run: gradle build --no-daemon --stacktrace -Pmod_version=1.0.${{ github.run_number }} 2>&1 | tee build.log
      - name: Fehler-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: poldi-client-jar
          path: build/libs/poldi-client-1.0.${{ github.run_number }}.jar
      - name: Release fuer Auto-Update veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "build/libs/poldi-client-1.0.${{ github.run_number }}.jar" \
            --title "Poldi Client 1.0.${{ github.run_number }}" \
            --notes "Automatischer Build fuer Minecraft 26.2. Der Client aktualisiert sich beim naechsten Start selbst." \
            --latest
